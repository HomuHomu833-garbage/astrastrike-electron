name: Build

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
          - macos-15-intel
          - windows-2022
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: 22

      - name: Setup Package
        run: npm install

      - name: Build Package
        run: npm run package

      - name: Apply Entitlements (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ldid
          bash ./scripts/mac-sign.sh out/AstraStrike-darwin-*/AstraStrike.app entitlements.plist

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: AstraStrike-${{ matrix.os }}
          path: out/AstraStrike-*-*/*
