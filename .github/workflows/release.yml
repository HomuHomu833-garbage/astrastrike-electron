name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/main.yml

  releaser:
    needs: [build]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Linux x86_64 Build
        uses: actions/download-artifact@main
        with:
          name: AstraStrike-ubuntu-latest
          path: /home/runner

      - name: Tar Linux x86_64 Build For Release
        run: |
          cd /home/runner/AstraStrike-linux-x64
          tar czf "/home/runner/AstraStrike-linux-x86_64.tar" .

      - name: Download Linux ARM64 Build
        uses: actions/download-artifact@main
        with:
          name: AstraStrike-ubuntu-24.04-arm
          path: /home/runner

      - name: Tar Linux ARM64 Build For Release
        run: |
          cd /home/runner/AstraStrike-linux-arm64
          tar czf "/home/runner/AstraStrike-linux-arm64.tar" .

      - name: Download macOS x86_64 Build
        uses: actions/download-artifact@main
        with:
          name: AstraStrike-macos-15-intel
          path: /home/runner

      - name: Tar macOS x86_64 Build For Release
        run: |
          cd /home/runner/AstraStrike-darwin-x64
          tar czf "/home/runner/AstraStrike-macos-x86_64.tar" .

      - name: Download macOS ARM64 Build
        uses: actions/download-artifact@main
        with:
          name: AstraStrike-macos-26
          path: /home/runner

      - name: Tar macOS ARM64 Build For Release
        run: |
          cd /home/runner/AstraStrike-darwin-arm64
          tar czf "/home/runner/AstraStrike-macos-arm64.tar" .

      - name: Download Windows x86_64 Build
        uses: actions/download-artifact@main
        with:
          name: AstraStrike-windows-2022
          path: /home/runner

      - name: Zip Windows x86_64 Build For Release
        run: |
          cd /home/runner/AstraStrike-win32-x64
          zip -r "/home/runner/AstraStrike-windows-x86_64.zip" .

      - name: Download Windows ARM64 Build
        uses: actions/download-artifact@main
        with:
          name: AstraStrike-windows-11-arm
          path: /home/runner

      - name: Zip Windows ARM64 Build For Release
        run: |
          cd /home/runner/AstraStrike-win32-arm64
          zip -r "/home/runner/AstraStrike-windows-arm64.zip" .

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "1.0.0"
          tag_name: "1.0.0"
          prerelease: false
          files: |
            /home/runner/*.tar
            /home/runner/*.zip
